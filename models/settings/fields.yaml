fields:
    endpoints:
        label: mercator.llmtranslate::lang.settings.endpoints
        commentAbove: mercator.llmtranslate::lang.settings.endpoints_comment
        type: repeater
        prompt: Add endpoint
        form:
            fields:
                name:
                    label: mercator.llmtranslate::lang.settings.name
                    comment: mercator.llmtranslate::lang.settings.name_comment
                    span: left
                    required: true
                format:
                    label: mercator.llmtranslate::lang.settings.format
                    type: dropdown
                    default: openai
                    span: right
                    options:
                        openai: mercator.llmtranslate::lang.settings.format_openai
                        anthropic: mercator.llmtranslate::lang.settings.format_anthropic
                base_url:
                    label: mercator.llmtranslate::lang.settings.base_url
                    comment: mercator.llmtranslate::lang.settings.base_url_comment
                    span: left
                    required: true
                model:
                    label: mercator.llmtranslate::lang.settings.model
                    span: right
                    required: true
                api_key:
                    label: mercator.llmtranslate::lang.settings.api_key
                    type: sensitive
                    span: left
                batch_size:
                    label: mercator.llmtranslate::lang.settings.batch_size
                    type: number
                    span: right
                test:
                    type: partial
                    path: $/mercator/llmtranslate/partials/_test_button.php
                    span: full
    instructions:
        label: mercator.llmtranslate::lang.settings.instructions
        commentAbove: mercator.llmtranslate::lang.settings.instructions_comment
        type: textarea
        size: small
    glossary:
        label: mercator.llmtranslate::lang.settings.glossary
        commentAbove: mercator.llmtranslate::lang.settings.glossary_comment
        type: textarea
        size: small
    models:
        label: mercator.llmtranslate::lang.settings.models
        commentAbove: mercator.llmtranslate::lang.settings.models_comment
        type: textarea
        size: small
        placeholder: RainLab\\Blog\\Models\\Post
    auto_enabled:
        label: mercator.llmtranslate::lang.settings.auto_enabled
        comment: mercator.llmtranslate::lang.settings.auto_enabled_comment
        type: switch
        default: false
    auto_provider:
        label: mercator.llmtranslate::lang.settings.auto_provider
        type: dropdown
        trigger:
            action: show
            field: auto_enabled
            condition: checked
    auto_models:
        label: mercator.llmtranslate::lang.settings.auto_models
        commentAbove: mercator.llmtranslate::lang.settings.auto_models_comment
        type: textarea
        size: small
        trigger:
            action: show
            field: auto_enabled
            condition: checked
